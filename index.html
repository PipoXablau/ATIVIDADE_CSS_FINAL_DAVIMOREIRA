<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagina teste css</title>
    <style>
        *{
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        img{
            text-align: center;
            width: 300px;
            height: 150px;
        }

        hr{
               background-color: rgb(32, 31, 31); 
                height: 1px;         
                border: 10px solid rgb(19, 16, 16);
                margin: 0 auto;
        }

        .csscor{
            color: red;
            font-size: 30px;
        }

        .oii{
            background-color: rgb(87, 202, 255);
            color: rgb(12, 9, 11);
        }

        .pao{
            border: 3px solid rgb(0, 47, 255);
            font-size: 25px;
            font-weight: bold;
            padding: 10px;
        }

        .corfont{
            color: rgb(221, 3, 203);
            font-style: italic;
            font-weight: bold;
        }

        .misturando{
            font-size: 25px;
            font-weight: bold;
        }
        
        .formatacao{
            color: rgb(15, 14, 14);
            border: 3px solid rgb(6, 75, 224);
            padding: 10px;
            font-size: 25px;
            font-weight: bold;
        }

        .formatacao{
            text-decoration: underline;
            font-weight: bold;
        }

        .exemplo{
            background-color: rgb(0, 102, 255);
            color: rgb(255, 0, 0);
            font-size: 50px;
            font-weight: bold;
            font-style: italic;
            text-decoration: underline;
        }


    </style>
</head>
<body>
    <h1>PAGINA TESTE CSS</h1> 
    <hr>


        <img src="_img/css01.jpg" alt="">
        <img src="_img/css02.jpg" alt="">
        <img src="_img/css03.png" alt="">
        <img src="_img/css04.png" alt="">
   
    <hr>
    <h2 class="csscor">CSS É VIDA!</h2>
    <p>Diversar possibilidades de incrementar seu HTML</p>
    <h1 >Exemplo de Cores no CSS</h1>
    <p class="oii">Exemplo  de texto com cor de fundo</p>
    <hr>
    <p class="corfont">Exemplo de texto com mundaça da cor da fonte</p>
    <hr  class="linha">
    <p class="pao">Exemplo de texto com borda colorida</p>
    <hr  class="linha">
    <p class="misturando" ">Misturando tudo</p>
    <p  class="formatacao">Exemplo de texto com várias formatações</p>
    <hr>
    <p class="exemplo">Mais um exemplo</p>

</body>
</html>
